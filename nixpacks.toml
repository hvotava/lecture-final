[phases.setup]
nixPkgs = ["nodejs_18", "npm"]

[phases.install]
cmds = [
    "cd react-dashboard/frontend && npm ci",
    "cd react-dashboard/backend && npm ci --only=production"
]

[phases.build]
cmds = [
    "cd react-dashboard/frontend && npm run build",
    "echo 'Build completed'"
]

[start]
cmd = "cd react-dashboard/backend && npm start" 