[providers]
node = "18.x"

[phases.setup]
nixPkgs = ["nodejs", "npm"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "cd react-dashboard/backend",
  "npm ci --only=production"
]

[phases.start]
dependsOn = ["install"]
cmd = "cd react-dashboard/backend && npm start"

[variables]
NODE_ENV = "production" 